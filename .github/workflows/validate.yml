name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every skill has a SKILL.md with name, pack and description
        run: |
          fail=0
          for d in skills/*/; do
            f="$d/SKILL.md"
            [ -f "$f" ] || { echo "::error::$d has no SKILL.md"; fail=1; continue; }
            for key in name pack description; do
              grep -q "^$key:" "$f" || { echo "::error::$f is missing '$key:'"; fail=1; }
            done
          done
          exit $fail

      # reindex stamps a fresh "generated" time on every run, so comparing the raw
      # file would always differ. What must not drift is the skill list itself.
      - name: index.json is current
        run: |
          cp index.json /tmp/index.committed
          ./bin/reindex
          if ! diff -q <(grep -v '"generated"' /tmp/index.committed) \
                       <(grep -v '"generated"' index.json) >/dev/null; then
            echo "::error::index.json is stale - run ./bin/reindex and commit it"
            diff <(grep -v '"generated"' /tmp/index.committed) \
                 <(grep -v '"generated"' index.json) || true
            exit 1
          fi

      - name: No personal or client identifiers
        run: |
          if grep -rinE 'donwi|titahspace|mumpuni|mktech|iconpln|/Users/|/home/[a-z]' \
               --include='*.md' skills/ ; then
            echo "::error::a personal or client identifier reached a public skill"
            exit 1
          fi
